<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>電路學講義 (五頁版)</title>
    <style>
        :root { --mineral-dark: #4a5759; --mineral-slate: #6b7a8f; --wood-dark: #8a7360; --wood-light: #e6dfd3; --paper-bg: #fdfbf7; --accent-terra: #b87355; --text-main: #333333; --text-muted: #666666; }
        body { background-color: #d1d5db; margin: 0; padding: 0; font-family: sans-serif; }
        .page { 
            width: 210mm; 
            height: 297mm; 
            padding: 20mm; 
            margin: 10mm auto; 
            background: white; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column;
            position: relative;
        }
        @media print {
            body { background: none; }
            .page { margin: 0; box-shadow: none; page-break-after: always; }
        }
        /* 頁尾強制固定在底部 */
        .footer { margin-top: auto; border-top: 1px solid #ddd; padding-top: 10px; text-align: center; color: #888; font-size: 9pt; }
        /* 其他樣式保持不變 */
        h2 { font-size: 16pt; color: #8a7360; border-left: 4px solid #8a7360; padding-left: 10px; margin-bottom: 20px; }
        .drawing-area { border: 1px dashed #6b7a8f; background: #ffffff; min-height: 200px; margin: 15px 0; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="page">
        <h2>1. 基礎概念</h2>
        <div class="drawing-area"></div>
        <div class="footer">Page 1</div>
    </div>

    <div class="page">
        <h2>2. 基礎實作</h2>
        <div class="footer">Page 2</div>
    </div>

    <div class="page">
        <h2>3. 麵包板與色碼</h2>
        <div class="footer">Page 3</div>
    </div>

    <div class="page">
        <h2>4. 測量與串並聯</h2>
        <div style="flex: 1;">
            <div style="margin-bottom: 30px;">[理論公式]</div>
            <div style="display: flex; gap: 20px;">
                <div style="flex:1;">[串聯圖示]</div>
                <div style="flex:1;">[並聯圖示]</div>
            </div>
            <div style="margin-top: 40px;">[表格]</div>
        </div>
        <div class="footer">Page 4</div>
    </div>

    <div class="page">
        <h2>5. 結業任務</h2>
        <div class="drawing-area"></div>
        <div class="footer">Page 5</div>
    </div>

</body>
</html>
