<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電路學講義：麵包板上的微型城市 (吾思質感版)</title>
    <style>
        :root {
            --mineral-dark: #4a5759; --mineral-slate: #6b7a8f; --wood-dark: #8a7360; 
            --wood-light: #e6dfd3; --paper-bg: #fdfbf7; --accent-terra: #b87355; 
            --text-main: #333333; --text-muted: #666666;
        }
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        body { background-color: #d1d5db; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--text-main); }
        .topic-page { width: 210mm; min-height: 297mm; padding: 20mm; margin: 10mm auto; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        @media print { body { background: none; } .topic-page { margin: 0; box-shadow: none; width: 100%; height: 100%; break-after: page; } }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid var(--mineral-dark); padding-bottom: 15px; margin-bottom: 25px; }
        .page-logo { height: 45px; object-fit: contain; }
        .header-right { text-align: right; }
        .main-title { font-size: 20pt; color: var(--mineral-dark); margin: 0 0 8px 0; font-weight: 600; letter-spacing: 1px; }
        .student-info { font-size: 11pt; color: var(--text-muted); display: flex; gap: 15px; justify-content: flex-end; }
        .underline { border-bottom: 1px solid var(--text-muted); min-width: 80px; display: inline-block; text-align: center; }
        h2 { font-size: 16pt; color: var(--wood-dark); border-left: 4px solid var(--wood-dark); padding-left: 12px; margin: 30px 0 20px; font-weight: 600; }
        h3 { font-size: 12pt; color: var(--mineral-slate); margin-top: 20px; margin-bottom: 10px; font-weight: 600; }
        p, li { font-size: 11.5pt; line-height: 1.8; margin-bottom: 10px; }
        .analogy-box { background: var(--paper-bg); border: 1px solid var(--wood-light); border-radius: 4px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: white; border: 1px solid var(--wood-light); border-radius: 4px; padding: 20px; text-align: center; }
        .alert { background: #fcf9f5; border-left: 4px solid var(--accent-terra); padding: 15px 20px; margin: 20px 0; border-radius: 0 4px 4px 0; color: #5c4538; }
        .drawing-area { border: 1px dashed var(--mineral-slate); flex-grow: 1; margin: 20px 0; display: flex; align-items: center; justify-content: center; color: var(--mineral-slate); background: var(--paper-bg); border-radius: 4px; min-height: 200px; font-size: 10pt; letter-spacing: 1px; }
        .reference-image-container { text-align: center; margin: 20px 0; }
        .reference-image-container img { max-width: 100%; max-height: 350px; border: 1px solid var(--wood-light); border-radius: 4px; padding: 10px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.03); object-fit: contain; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 11pt; }
        th, td { border: 1px solid var(--wood-light); padding: 10px 12px; text-align: center; }
        th { background: var(--paper-bg); color: var(--wood-dark); font-weight: 600; }
        .footer { margin-top: auto; font-size: 9pt; color: var(--text-muted); text-align: center; padding-top: 20px; border-top: 1px solid var(--wood-light); }
        .formula { font-family: monospace; font-size: 12pt; background: var(--paper-bg); color: var(--mineral-dark); border: 1px solid var(--wood-light); padding: 15px 20px; border-radius: 4px; display: block; margin: 15px 0; letter-spacing: 0.5px; text-align: left; }
        .stamp-box { border: 1px dashed var(--mineral-slate); width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; font-size: 10pt; color: var(--mineral-slate); margin: 20px 0; background: var(--paper-bg); border-radius: 4px; }
        .tag { display: inline-block; background: var(--wood-dark); color: white; padding: 2px 8px; border-radius: 2px; font-size: 9pt; margin-right: 8px; vertical-align: text-bottom; }
    </style>
</head>
<body>
    <div class="topic-page">
        <div class="header"><img src="logo.jpg" class="page-logo" alt="吾思 Logo"><div class="header-right"><h1 class="main-title">麵包板上的微型城市</h1><div class="student-info">姓名：<span class="underline"></span> 日期：<span class="underline"></span></div></div></div>
        <h2>1. 課前暖身：電流是什麼？</h2>
        <p>想像一下家裡的水管系統。電路就像水路，讓能量在其中流動：</p>
        <div class="analogy-box">
            <div class="card"><h3 style="color:var(--mineral-dark)">水流系統</h3><p>抽水馬達 (推力) → 水管 (通道) → 水車 (消耗能量工作) → 窄管/減速丘 (限制流速)</p></div>
            <div class="card"><h3 style="color:var(--wood-dark)">電流系統</h3><p>電池 (電壓/推力) → 導線 (電流通道) → LED 燈泡 (發光工作) → 電阻器 (限制電流)</p></div>
        </div>
        <p style="margin-top:40px;"><span class="tag">思考任務</span> 如果水管破了，水會流失；那如果電線斷了，電流會發生什麼事？</p>
        <div class="drawing-area" style="min-height: 100px;">寫下或畫下你的想法</div>
        <div class="footer">Page 1: 引言與生活比喻</div>
    </div>
    </body>
</html>
